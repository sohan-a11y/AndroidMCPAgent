name: Build & Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Generate gradle wrapper if JAR is missing
      # (wrapper scripts + properties exist, but binary JAR may not)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          # Ensure ANDROID_HOME is set and available to all steps
          # setup-java action should have set this, but we make it explicit
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "Android SDK location: $ANDROID_HOME"

      - name: Accept Android SDK Licenses
        run: |
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || echo "Warning: License acceptance failed, but continuing..."
          else
            echo "Warning: sdkmanager not found at expected location, skipping license acceptance"
          fi

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version=8.5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK was produced
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file not found at $APK_PATH"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "APK found at $APK_PATH"
          echo "APK size: $APK_SIZE bytes ($(($APK_SIZE / 1024 / 1024)) MB)"
          if [ $APK_SIZE -lt 1000000 ]; then
            echo "Warning: APK size is suspiciously small (< 1 MB)"
            exit 1
          fi
          echo "APK verification passed!"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-mcp-agent-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

