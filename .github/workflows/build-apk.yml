name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Debug + Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "Android SDK location: $ANDROID_HOME"

      - name: Validate signing secrets
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "Signing secrets are required to produce installable CI APKs."
            exit 1
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Install Android SDK Platform 36 + Build Tools
        run: |
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
          else
            echo "sdkmanager not found at $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            exit 1
          fi

      - name: Decode keystore
        run: |
          set -euo pipefail
          B64="$KEYSTORE_BASE64"
          # Accept either raw base64 or an accidental "KEYSTORE_BASE64=<value>" paste.
          B64="${B64#KEYSTORE_BASE64=}"
          # Remove whitespace/newlines that may be introduced during copy-paste.
          B64="$(printf '%s' "$B64" | tr -d '\r\n\t ')"
          if [ -z "$B64" ]; then
            echo "KEYSTORE_BASE64 secret resolved to empty after normalization."
            exit 1
          fi
          if ! printf '%s' "$B64" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"; then
            echo "Failed to decode KEYSTORE_BASE64. Ensure the secret contains only the base64 keystore content."
            exit 1
          fi
          if [ ! -s "$GITHUB_WORKSPACE/release-keystore.jks" ]; then
            echo "Decoded keystore file is empty."
            exit 1
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create keystore.properties for Gradle
        run: |
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/release-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Ensure gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug and release APKs
        run: |
          ./gradlew \
            :app:assembleDebug \
            :app:assembleRelease \
            -PciVersionCode=${{ github.run_number }} \
            -PciSignDebug=true \
            --no-daemon \
            --stacktrace

      - name: Verify APK signatures and metadata
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          for apk in "$DEBUG_APK" "$RELEASE_APK"; do
            if [ ! -f "$apk" ]; then
              echo "APK missing: $apk"
              exit 1
            fi
            echo "\n=== Signature verify: $apk ==="
            "$APKSIGNER" verify --print-certs "$apk"
            echo "\n=== Badging: $apk ==="
            "$AAPT" dump badging "$apk" | grep -E "^package: name=|versionCode=|versionName="
          done

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-ai-mcp-debug-signed
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-ai-mcp-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release artifacts (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
